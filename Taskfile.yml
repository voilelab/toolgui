version: '3'

tasks:
  # Placeholder assets so `go build` works without a yarn build.
  stub_assets:
    cmds:
      - ./scripts/stub-assets.sh

  asset_lib:
    dir: ./toolgui-web/lib
    cmds:
      - yarn
      - yarn build
      - yarn typecheck
  
  asset_app:
    dir: ./toolgui-web/app
    cmds:
      - yarn
      - yarn build
      - yarn typecheck

  # Builds into toolgui-wails/assets, which assets.go embeds.
  asset_wails:
    dir: ./toolgui-web/wails
    cmds:
      - yarn
      - yarn build
      - yarn typecheck
  
  run_demo:
    cmds:
      - task: asset_lib
      - task: asset_app
      - go run ./cmd/toolgui-demo/main.go

  run_todo:
    cmds:
      - task: asset_lib
      - task: asset_app
      - go run ./cmd/toolgui-todo/main.go

  # The wails CLI builds the frontend and the app, and supplies the build tags
  # and macOS frameworks a desktop build needs. Needs the webview deps, see
  # toolgui-wails/README.md.
  wails_hello:
    internal: true
    dir: ./toolgui-wails/example/hello
    vars:
      # webkit2_41 is Linux only, and only for distributions that dropped
      # WebKit2GTK 4.0. Override with TAGS= on one that still ships it.
      DEFAULT_TAGS: '{{if eq OS "linux"}}webkit2_41{{end}}'
      TAGS: '{{.TAGS | default .DEFAULT_TAGS}}'
      TAG_FLAG: '{{if .TAGS}}-tags {{.TAGS}}{{end}}'
    cmds:
      # The CLI generates bindings before it builds the frontend, so the embed
      # in assets.go has to resolve before any of it runs.
      - task: stub_assets
      - go tool wails {{.WAILS_CMD}} {{.TAG_FLAG}}

  # Desktop demo, with the frontend served from disk and a Go file watcher.
  run_wails_hello:
    cmds:
      - task: wails_hello
        vars:
          WAILS_CMD: dev

  # Desktop demo as a packaged binary, in example/hello/build/bin.
  build_wails_hello:
    cmds:
      - task: wails_hello
        vars:
          WAILS_CMD: build
