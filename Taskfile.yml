version: '3'

tasks:
  # Placeholder assets so `go build` works without a yarn build.
  stub_assets:
    cmds:
      - ./scripts/stub-assets.sh

  asset_lib:
    dir: ./toolgui-web/lib
    cmds:
      - yarn
      - yarn build
      - yarn typecheck
  
  asset_app:
    dir: ./toolgui-web/app
    cmds:
      - yarn
      - yarn build
      - yarn typecheck

  # Builds into toolgui-wails/assets, which assets.go embeds.
  asset_wails:
    dir: ./toolgui-web/wails
    cmds:
      - yarn
      - yarn build
      - yarn typecheck
  
  run_demo:
    cmds:
      - task: asset_lib
      - task: asset_app
      - go run ./cmd/toolgui-demo/main.go

  run_todo:
    cmds:
      - task: asset_lib
      - task: asset_app
      - go run ./cmd/toolgui-todo/main.go

  # Desktop demo. Needs the webview deps and the wails build tags, see
  # toolgui-wails/README.md.
  run_wails_hello:
    dir: ./toolgui-wails
    vars:
      TAGS: '{{.TAGS | default "production,webkit2_41"}}'
    cmds:
      - task: asset_lib
      - task: asset_wails
      - go run -tags "{{.TAGS}}" ./example/hello
