name: Wails

on:
  push:
    branches: [ "dev" ]
    paths-ignore: [ "docs/src/**" ]
  pull_request:
    branches: [ "dev" ]
    paths-ignore: [ "docs/src/**" ]

jobs:
  desktop-cli:
    name: Desktop CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A few minutes normally; a hung apt mirror should fail, not run 6h.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: toolgui-wails
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: toolgui-wails/go.mod
          cache-dependency-path: toolgui-wails/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: toolgui-web/yarn.lock

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth

      - name: Build the release frontend
        working-directory: toolgui-web
        run: |
          yarn install --frozen-lockfile
          yarn workspace @toolgui-web/wails build

      - name: Cache Go dependencies for the offline consumer test
        run: go mod download

      - name: Vet the CLI
        run: go vet ./cmd/toolgui-desktop

      # This creates a separate consumer module, installs the Go tool and
      # removes Node/Yarn from its PATH before building and running the app.
      - name: Test CLI and external project
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            TOOLGUI_DESKTOP_GUI_SMOKE=1 xvfb-run -a go test -count=1 -v ./cmd/toolgui-desktop
          else
            go test -count=1 -v ./cmd/toolgui-desktop
          fi
        env:
          TOOLGUI_DESKTOP_INTEGRATION: '1'

  wails:
    name: Wails Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WAILS_TAGS: production,webkit2_41
    defaults:
      run:
        working-directory: toolgui-wails
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: toolgui-wails/go.sum

      # The CLI build runs yarn in the frontend workspace.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: toolgui-web/yarn.lock

      - name: Install webview deps
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Stub assets
        working-directory: .
        run: ./scripts/stub-assets.sh

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      # production picks the real app over the stub that tells you to set build
      # tags; webkit2_41 asks for the webkit Ubuntu still ships.
      - name: Build
        run: go build -tags "$WAILS_TAGS" ./...

      - name: Vet
        run: go vet -tags "$WAILS_TAGS" ./...

      - name: Test
        run: go test -tags "$WAILS_TAGS" ./...

      # The library builds with plain go above. This covers the other half:
      # wails.json, the frontend build and the embed, the way a user builds.
      - name: Build the example with the wails CLI
        working-directory: toolgui-wails/example/hello
        run: go tool wails build -tags webkit2_41
