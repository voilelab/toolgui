name: Wails

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  wails:
    name: Wails Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolgui-wails
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: toolgui-wails/go.sum

      - name: Install webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          # wails v1 asks pkg-config for webkit2gtk-4.0, which Ubuntu dropped
          # after 22.04. Point that name at 4.1.
          printf 'Name: webkit2gtk-4.0 shim\nDescription: Maps the wails v1 dependency onto webkit2gtk-4.1\nVersion: %s\nRequires: webkit2gtk-4.1\n' \
            "$(pkg-config --modversion webkit2gtk-4.1)" \
            | sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc > /dev/null

      - name: Stub assets
        working-directory: .
        run: ./scripts/stub-assets.sh

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
