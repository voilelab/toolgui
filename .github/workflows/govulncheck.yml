# Govulncheck for push and pull_request, fails the steps if vulnerabilities are found

name: Govulncheck

on:
  push:
    branches: [ "dev" ]
    paths-ignore: [ "docs/src/**" ]
  pull_request:
    branches: [ "dev" ]
    paths-ignore: [ "docs/src/**" ]

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    name: Vulnerability Scan
    steps:
    - uses: golang/govulncheck-action@v1
      with:
        # Scan with the Go go.mod pins, not the runner's cached one.
        go-version-input: ''
        go-version-file: go.mod
        go-package: ./...
