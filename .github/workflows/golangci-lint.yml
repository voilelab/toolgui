name: GolangCI-Lint

on:
  push:
    branches: [ "dev" ]
    paths-ignore: [ "docs/src/**" ]
  pull_request:
    branches: [ "dev" ]
    paths-ignore: [ "docs/src/**" ]

jobs:
  golangci-lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Pin to go.mod: a Go newer than golangci-lint's own build panics it
          go-version-file: go.mod
          cache-dependency-path: go.sum
      
      # The same stub the other workflows use, so a new embed only has to be
      # added in one place.
      - name: Stub web assets
        run: ./scripts/stub-assets.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
