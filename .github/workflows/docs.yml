name: Docs

# Publishes docs/ (mdBook) to GitHub Pages from main, so the book matches the
# released API rather than dev.
#
# Release pushes main with GITHUB_TOKEN, and pushes made with that token do not
# start workflow runs -- so this hangs off the Release run instead of `on:
# push`. Use Run workflow to republish main by hand.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight; skip the ones queued behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    # workflow_dispatch has no triggering run to check.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        working-directory: docs
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/book

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
