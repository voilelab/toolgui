name: Docs

# Publishes docs/ (mdBook) to GitHub Pages from main, so the book matches the
# released API rather than dev. The wasm demo goes up beside it, under /demo.
#
# Release pushes main with GITHUB_TOKEN, and pushes made with that token do not
# start workflow runs -- so this hangs off the Release run instead of `on:
# push`. Use Run workflow to republish main by hand.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight; skip the ones queued behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    # workflow_dispatch has no triggering run to check.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.36
      MDBOOK_MERMAID_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Renders the mermaid blocks in docs/src. A binary, not `cargo install`:
      # building it from source adds minutes to every run. `install` writes the
      # mermaid runtime that book.toml's additional-js points at -- it is
      # generated here rather than committed, so it is not in the repo.
      - name: Install mdbook-mermaid
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          "$HOME/.local/bin/mdbook-mermaid" install docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        working-directory: docs
        run: mdbook build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The browser frontend is committed by Release, so this needs no yarn.
      # A main released before it existed just skips the demo.
      - name: Build the wasm demo
        run: |
          if [ ! -f toolgui-web/wasm/build/index.html ]; then
            echo "::warning::no browser assets on main, skipping the demo"
            exit 0
          fi
          go run ./cmd/toolgui-wasm build -o docs/book/demo ./cmd/toolgui-demo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/book

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
