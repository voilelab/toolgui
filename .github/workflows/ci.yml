name: CI

on:
  push:
    branches: [ "dev" ]
    paths-ignore: [ "docs/**" ]
  pull_request:
    branches: [ "dev" ]
    paths-ignore: [ "docs/**" ]

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Stub web assets
        run: ./scripts/stub-assets.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # tgwasm and its example are behind js && wasm, so the build above
      # never sees them.
      - name: Build for wasm
        run: GOOS=js GOARCH=wasm go build ./...

      # tgframe in a browser: the wasm build keeps uploads in the origin private
      # file system, which exists nowhere else, and reads them through handles
      # only a dedicated worker gets. The runner drives the Chrome the image
      # already ships. tgexec is left out -- it serves over HTTP, and a tab has
      # no socket to listen on.
      - name: Test for wasm
        run: |
          go build -o "$RUNNER" ./scripts/wasmtest
          GOOS=js GOARCH=wasm go test -exec "$RUNNER" ./toolgui/tgframe/... \
            ./toolgui/tgwasm/...
        env:
          RUNNER: ${{ runner.temp }}/toolgui-wasmtest

  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolgui-web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: toolgui-web/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build lib
        run: yarn workspace @toolgui-web/lib build

      - name: Typecheck lib
        run: yarn workspace @toolgui-web/lib typecheck

      - name: Typecheck app
        run: yarn workspace @toolgui-web/app typecheck

      - name: Test app
        run: yarn workspace @toolgui-web/app test

      - name: Build app
        run: yarn workspace @toolgui-web/app build

      - name: Typecheck wails
        run: yarn workspace @toolgui-web/wails typecheck

      - name: Test wails
        run: yarn workspace @toolgui-web/wails test

      - name: Typecheck wasm
        run: yarn workspace @toolgui-web/wasm typecheck

      - name: Build wasm
        run: yarn workspace @toolgui-web/wasm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            toolgui-web/yarn.lock
            toolgui-e2e/yarn.lock

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build web assets
        working-directory: toolgui-web
        run: |
          yarn install --frozen-lockfile
          yarn workspace @toolgui-web/lib build
          yarn workspace @toolgui-web/app build

      # cypress.config.js points at 127.0.0.1:3000, where the demo listens
      - name: Start demo server
        run: |
          go build -o /tmp/toolgui-demo ./cmd/toolgui-demo
          nohup /tmp/toolgui-demo > /tmp/toolgui-demo.log 2>&1 &

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: toolgui-e2e
          browser: chrome
          wait-on: http://127.0.0.1:3000
          wait-on-timeout: 60

      - name: Dump demo server log
        if: failure()
        run: cat /tmp/toolgui-demo.log

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots
          path: toolgui-e2e/cypress/screenshots
          if-no-files-found: ignore

  # The same demo as a static site, driven through the wasm bridge instead of
  # HTTP. It is a job of its own because the build is: the browser build has
  # its own frontend and compiles the app into the page.
  e2e-wasm:
    name: E2E (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            toolgui-web/yarn.lock
            toolgui-e2e/yarn.lock

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build web assets
        working-directory: toolgui-web
        run: |
          yarn install --frozen-lockfile
          yarn workspace @toolgui-web/lib build
          yarn workspace @toolgui-web/wasm build

      # 127.0.0.1 rather than a hostname: the origin private file system the
      # uploads go into belongs to a secure context, which localhost is and
      # anything else on plain http is not.
      - name: Start the static site
        run: |
          go run ./cmd/toolgui-wasm build -o /tmp/wasm-demo ./cmd/toolgui-demo
          nohup go run ./cmd/toolgui-wasm serve -addr 127.0.0.1:3000 \
            -o /tmp/wasm-demo ./cmd/toolgui-demo > /tmp/wasm-demo.log 2>&1 &

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: toolgui-e2e
          config-file: cypress-wasm.config.js
          browser: chrome
          wait-on: http://127.0.0.1:3000
          wait-on-timeout: 60

      - name: Dump the static site log
        if: failure()
        run: cat /tmp/wasm-demo.log

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots-wasm
          path: toolgui-e2e/cypress/screenshots
          if-no-files-found: ignore
