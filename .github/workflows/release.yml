name: Release

# Builds the web assets, commits them on top of dev, tags, and publishes.
# `go get` resolves tags, so the tagged commit is what must carry app/build,
# toolgui-wails/frontend/dist and toolgui-web/wasm/build.
# Each release commit also carries the previous release tag as a second
# parent, so the tags form a chain. GitHub's generated notes need that: a tag
# with no earlier release in its history gets notes listing every PR ever.
# main is the branch those release commits live on.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (vX.Y.Z)'
        required: true

jobs:
  release:
    name: Build assets and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # Both tags: toolgui-wails is its own module, so `go get` resolves it
      # through a path-prefixed tag rather than the bare one.
      - name: Check tags are free
        run: |
          for t in "$VERSION" "toolgui-wails/$VERSION"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "::error::tag $t already exists"
              exit 1
            fi
          done

      # The release commit is built on dev, which never sees the previous
      # release commit, so without this every tag is an island. `-s ours`
      # records the ancestry and keeps dev's tree exactly as it is; the stale
      # assets it carries are rebuilt below.
      - name: Chain the previous release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The highest tag below VERSION, so a late patch release chains to
          # its own line rather than to whatever is newest.
          prev="$({ git tag --list 'v*'; echo "$VERSION"; } | sort -V \
            | grep -B1 -x "$VERSION" | head -1)"
          [ "$prev" = "$VERSION" ] && prev=""
          echo "PREV_TAG=$prev" >> "$GITHUB_ENV"
          if [ -n "$prev" ]; then
            git merge -s ours --no-edit -m "Chain $prev into $VERSION" "$prev"
          fi

      # v0.2.3 shipped a go.mod whose path no longer matched the repo, which
      # broke `go get` until the next release. Never again.
      - name: Check module path matches repository
        env:
          REPO: ${{ github.repository }}
        run: |
          want="github.com/$REPO"
          got="$(sed -n 's/^module[[:space:]]\+//p' go.mod | head -1)"
          if [ "$got" != "$want" ]; then
            echo "::error::go.mod declares '$got' but repository is '$want'"
            exit 1
          fi

      # tgframe.Version reads the module version out of the build info, which
      # is empty for a binary built from inside this repo. Keep the fallback
      # the tag it ships under.
      - name: Stamp fallback version
        run: |
          f=toolgui/tgframe/version.go
          sed -i "s|^const fallbackVersion = \".*\"$|const fallbackVersion = \"$VERSION\"|" "$f"
          grep -q "const fallbackVersion = \"$VERSION\"" "$f"

      # A replace only applies in the main module, so what a consumer of the
      # desktop module resolves is this require. Left at v0.0.0 it resolves to
      # nothing and `go get` fails.
      - name: Stamp the desktop module's parent requirement
        run: |
          f=toolgui-wails/go.mod
          sed -i "s|^\(\s*github.com/voilelab/toolgui\) v[^ ]*|\1 $VERSION|" "$f"
          grep -q "github.com/voilelab/toolgui $VERSION" "$f"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: toolgui-web/yarn.lock

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build web assets
        working-directory: toolgui-web
        run: |
          yarn install --frozen-lockfile
          yarn workspace @toolgui-web/lib build
          yarn workspace @toolgui-web/lib typecheck
          yarn workspace @toolgui-web/app build
          yarn workspace @toolgui-web/wails typecheck
          yarn workspace @toolgui-web/wails build
          yarn workspace @toolgui-web/wasm typecheck
          yarn workspace @toolgui-web/wasm build

      - name: Verify assets exist
        run: |
          test -f toolgui-web/app/build/index.html
          test -n "$(ls -A toolgui-web/app/build/static)"
          # toolgui-wails/assets.go embeds this, so a tag without it breaks
          # `go get` for the desktop module.
          test -s toolgui-wails/frontend/dist/index.html
          # cmd/toolgui-wasm embeds this, and Pages builds the demo from it.
          test -s toolgui-web/wasm/build/index.html

      # Compile against the real assets, not the CI stub.
      - name: Build and test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Commit assets and tag
        run: |
          git add toolgui/tgframe/version.go toolgui-wails/go.mod
          # All three are gitignored on dev; -f includes them for the release
          # only.
          git add -f toolgui-web/app/build toolgui-wails/frontend/dist \
            toolgui-web/wasm/build
          git commit -m "Build assets and stamp version for $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          # Go resolves a module in a subdirectory through a tag named after
          # it. Without this one, `go get` on the desktop module falls back to
          # dev's head, where the embedded assets are gitignored.
          git tag -a "toolgui-wails/$VERSION" -m "toolgui-wails $VERSION"

      - name: Push tags and main
        run: |
          git push origin "refs/tags/$VERSION" \
            "refs/tags/toolgui-wails/$VERSION"
          # A fast-forward now that main's head is an ancestor; --force only
          # covers main having drifted.
          git push --force origin "HEAD:refs/heads/main"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --generate-notes finds PREV_TAG on its own now, but say it anyway
          # so a broken chain shows up as wrong notes, not a repo-wide dump.
          gh release create "$VERSION" --title "$VERSION" --generate-notes \
            ${PREV_TAG:+--notes-start-tag "$PREV_TAG"}
